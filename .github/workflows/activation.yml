on: workflow_dispatch
jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2019.4.40f1
      - uses: actions/upload-artifact@v4
        with:
          name: UnityActivationFile
          path: Unity_v2019.4.40f1.alf
